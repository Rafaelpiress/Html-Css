<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Pulsar Trix</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="shortcut icon" href="../imagens/logo-transparente.png" type="image/x-icon">
</head>
<body>
    <header class="menu">
        <img src="../imagens/logo-transparente.png" class="imagenT" alt="">

     <nav>
      <ul>
      <li><a href="../index.html">Inicio</a></li>
      <li><a href="Quem-somos.html">Quem Somos</a></li>
      <li><a href="produtos.html">Produtos</a></li>
      <li><a href="cadastro.html">Cadastro</a></li>
      <li><a href="Fale-conosco.html">Fale Conosco</a></li>
     </ul>
     </nav>

    </header>

    <main class="caixa-cadastro">
        <h1>Criar Conta</h1>
        <p class="subtitulo-form">Cadastre-se para acompanhar seus pedidos</p>

        <div class="card-form">
        <form id="form-cadastro">
        <div class="campo-form">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>

        <div class="campo-form">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
        </div>

        <div class="campo-form">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
        </div>

        <div class="campo-form">
        <label for="confirmar-senha">Confirmar senha</label>
        <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Repita a senha" required>
        </div>

        <button type="button" class="btn-cadastrar" onclick="window.location.href='produtos.html'">Cadastrar</button>
        </form>
    
</body>
</html>
